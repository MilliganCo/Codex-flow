[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-tree-explorer"
version = "1.0.0"
description = "A dependency-free procedural ASCII tree explorer in 2D, 3D and 4D"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ascii-tree = "ascii_tree.cli:main"

[tool.setuptools.packages.find]
include = ["ascii_tree*"]
