name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline unit and integration checks
        run: python -B -m unittest discover -s tests -v
      - name: Accepted ASCII examples without models or browsers
        run: python -B tools/check_examples.py
      - name: Install pinned development checks
        run: python -m pip install ruff==0.12.5 mypy==1.17.1
      - name: Static checks
        run: |
          python -m ruff check --select F821,F822,F823,F811 runtime payload/codex-flow/scripts tools tests
          python -m mypy runtime/codex_flow
      - name: Compile and package
        run: |
          python -m compileall -q runtime payload/codex-flow/scripts
          python tools/build.py
          python dist/codex-flow.pyz --help
      - name: Scan tracked tree and all history
        run: python tools/security_scan.py --history
